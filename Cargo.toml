[workspace]
resolver = "2"
members  = ["cli", "integrations", "rpc"]

[workspace.dependencies]
anchor-client         = { version = "1.0.0 ", features = ["async"] }
anchor-lang           = "1"
anchor-spl            = "1"
solana-keypair        = "3.1.2"
solana-rpc-client     = "3.1.12"
solana-rpc-client-api = "3.1.12"
solana-account        = "3.4.0"
solana-transaction    = "3.1.0"
solana-message        = "3.1.0"

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
base64 = "0.22"
bincode = "1.3"

error-stack = { version = "0.7.0", features = ["serde"] }
thiserror = "2.0.18"
dotenvy = "0.15.7"
serde_json = "1.0.149"
serde = "1.0.228"
futures = "0.3"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = [
    "env-filter",
    "time",
    "json",
] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
